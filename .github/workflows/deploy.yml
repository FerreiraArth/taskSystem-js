name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        run: |
          mkdir -p public/src
          cp -r src/css public/src/
          cp -r src/JS public/src/
          if [ -d src/assets ]; then
            cp -r src/assets public/src/
          fi

      - name: Enviar arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4