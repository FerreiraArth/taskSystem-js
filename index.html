<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <link rel="stylesheet" href="src/css/style.css">
    
</head>
<body>
    
<main>
    
    <h1>TO DO</H1>
    <form id="campoFormulario">
        <input id="tarefa" type="text" placeholder="Digite uma tarefa">
        <button id="adicionar" type="submit">Adicionar</button>
    </form>

    <section id="filtros">
        <button id="todos" data-filtro="TODOS" class="ativo">Todas as tarefas</button>
        <button id="pendentes" data-filtro="PENDENTES">Em Andamento</button>
        <button id="concluidos" data-filtro="CONCLUÍDAS">Finalizadas</button>
    </section>

    <p id="mensagem"></p>

    <ul id="listaTarefas"></ul>

    <p id="contador"></p>

</main>

<script type="module" src="src/JS/main.js"></script>

</body>
</html>
